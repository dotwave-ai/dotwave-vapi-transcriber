[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dotwave-vapi-transcriber"
version = "0.1.0"
description = "Use .wave as the transcriber for Vapi voice agents through Vapi's custom transcriber interface."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dollyglot, Inc." }]
keywords = ["vapi", "dotwave", "speech-to-text", "transcriber", "websocket"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["websockets>=13"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
dotwave-vapi-transcriber = "dotwave_vapi_transcriber.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dotwave_vapi_transcriber"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
